[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zeta-ai"
version = "0.3.4"
description = "A minimalist Pi-style coding-agent harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "rich>=13.0",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.scripts]
zeta = "zeta_coding.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta_ai", "src/zeta_agent", "src/zeta_coding"]
